plugins {
    id 'java'
    id 'fabric-loom' version '1.19.3'
}

version = '0.0.2'
group = 'com.xiaotang.j20updatemod'

base {
    archivesName = 'j20UpdateMod-26.3-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // 26.x 起 Minecraft jar 未混淆且 Mojang 不再发布 mappings（yarn 亦无 26.x），
    // 官方名即生产名：用 Fabric 的恒等映射 intermediary:0.0.0:v2 占位 mappings 配置。
    minecraft 'com.mojang:minecraft:26.3'
    mappings 'net.fabricmc:intermediary:0.0.0:v2'
    // 无混淆时代 mod 依赖不再需要 remap，与 fabric-example-mod master 一致用 implementation；
    // fabric-api 总包只含嵌套 jar，编译期额外以 compileOnly 引入所需模块的类。
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    compileOnly 'net.fabricmc.fabric-api:fabric-networking-api-v1:6.4.0+a21c9eb65d'
    compileOnly 'net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7'
    compileOnly 'com.google.code.gson:gson:2.13.1'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.named('jar', Jar) {
    // 文件名遵循文档 1.3：j20UpdateMod-{mc_version}-{loader}.jar（版本号只在元数据里）
    archiveVersion = ''
    manifest {
        attributes([
                'Specification-Title'   : 'j20UpdateMod',
                'Specification-Vendor'  : '小坣',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'j20UpdateMod',
                'Implementation-Version': project.version,
                'Implementation-Vendor' : '小坣'
        ])
    }
}

tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask) {
    archiveVersion = ''
}
