plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.2.1'
group = 'com.xiaotang.j20updatemod'

base {
    archivesName = 'j20UpdateMod-1.21.1-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    version = '21.1.255'

    runs {
        client {
            client()
        }
    }

    mods {
        j20updatemod {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('jar', Jar) {
    // 文件名遵循文档 1.3：j20UpdateMod-{mc_version}-{loader}.jar（版本号只在元数据里）
    manifest {
        attributes([
                'Specification-Title'   : 'j20UpdateMod',
                'Specification-Vendor'  : '小坣',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'j20UpdateMod',
                'Implementation-Version': project.version,
                'Implementation-Vendor' : '小坣'
        ])
    }
}
